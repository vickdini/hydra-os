[package]
name = "hydra"
version = "0.1.0"
edition = "2021"
authors = ["Vick Dini"]
build = false

[dependencies]
uefi = "0.41.0"
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
spin = "0.9"
log = "0.4"
linked_list_allocator = "0.10.6"
patina_lzma_rs = { version = "0.3.2", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
